<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brenda Belén</title>
    <link rel="icon" type="image/jpeg" href="https://i.imgur.com/xO4JM2R.jpeg">
    <meta name="description" content="Brenda Belén">
    <style>
        html {
            scroll-behavior: smooth;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #f3c6d3;
            overflow-x: hidden;
        }

        /* Menú superior blanco */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            z-index: 100;
        }
        .top-nav a {
            color: #e87a9f;
            text-decoration: none;
            text-transform: uppercase;
            font-family: sans-serif;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 2px;
            transition: opacity 0.2s ease;
        }
        .top-nav a:hover {
            opacity: 0.65;
        }

        /* Divisor de puntilla entre el menú y la portada */
        .lace-divider {
            position: fixed;
            top: 60px;
            left: 0;
            width: 100%;
            height: 24px;
            background-image: url('https://media.tenor.com/wgLzjXM5XqUAAAAj/lace-coquette.gif');
            background-repeat: repeat-x;
            background-position: center top;
            background-size: auto 100%;
            z-index: 99;
            pointer-events: none;
        }

        /* Sección 1: Portada principal */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .main-photo {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center center;
            will-change: transform, opacity;
        }

        /* Flecha blanca animada para bajar */
        .scroll-arrow {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: none;
            border: none;
            padding: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            animation: floatDown 2s ease-in-out infinite;
            transition: opacity 0.35s ease, transform 0.3s ease;
        }
        .scroll-arrow:hover {
            transform: translateX(-50%) scale(1.12);
        }
        .scroll-arrow.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .scroll-arrow svg {
            width: 38px;
            height: 38px;
            stroke: #ffffff;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.22));
        }

        @keyframes floatDown {
            0%, 100% {
                transform: translate(-50%, 0);
            }
            50% {
                transform: translate(-50%, 10px);
            }
        }

        /* Sección 2: Sobre mí */
        .second-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-color: #f3c6d3;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .second-photo {
            display: block;
            width: 100%;
            height: 100vh;
            object-fit: cover;
            opacity: 0;
            transform: translateY(45px) scale(1.03);
            transition: opacity 1s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform, opacity;
        }
        .second-section.visible .second-photo {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Destellos del cursor */
        .cursor-sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.6s ease-out, opacity 0.6s ease-out;
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="#sobre-mi">Sobre mi</a>
        <a href="#proyectos">Proyectos</a>
        <a href="#contacto">Contacto</a>
    </nav>
    <div class="lace-divider"></div>

    <!-- Primera pantalla -->
    <section class="hero-section" id="inicio">
        <img src="https://i.imgur.com/jPRZ4aj.jpeg" alt="Brenda Belén" class="main-photo" id="heroPhoto">

        <a href="#sobre-mi" class="scroll-arrow" id="scrollArrow" aria-label="Bajar">
            <svg viewBox="0 0 24 24">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </a>
    </section>

    <!-- Segunda pantalla -->
    <section class="second-section" id="sobre-mi">
        <img src="https://i.imgur.com/L9Evpgj.jpeg" alt="Sobre mí" class="second-photo">
    </section>

    <script>
    (function() {
        var heroPhoto = document.getElementById('heroPhoto');
        var scrollArrow = document.getElementById('scrollArrow');
        var secondSection = document.getElementById('sobre-mi');

        // Parallax y ocultamiento de flecha al scrollear
        window.addEventListener('scroll', function() {
            var scrollY = window.pageYOffset || document.documentElement.scrollTop;
            var windowH = window.innerHeight;

            if (scrollY > 40) {
                scrollArrow.classList.add('hidden');
            } else {
                scrollArrow.classList.remove('hidden');
            }

            if (scrollY <= windowH) {
                var progress = scrollY / windowH;
                heroPhoto.style.transform = 'translateY(' + (scrollY * 0.25) + 'px) scale(' + (1 + progress * 0.05) + ')';
                heroPhoto.style.opacity = Math.max(1 - progress * 0.65, 0.35);
            }
        }, { passive: true });

        // Aparición de la segunda sección
        var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    secondSection.classList.add('visible');
                }
            });
        }, { threshold: 0.15 });
        observer.observe(secondSection);

        // Estela de destellos en el cursor
        var colors = ['#ffffff', '#ff85b3', '#ffd1e3', '#ff4d94', '#fff0f6'];
        var lastTime = 0;

        document.addEventListener('mousemove', function(e) {
            var now = Date.now();
            if (now - lastTime < 22) return;
            lastTime = now;

            var spark = document.createElement('span');
            spark.className = 'cursor-sparkle';
            var size = Math.random() * 6 + 3;
            var color = colors[Math.floor(Math.random() * colors.length)];

            spark.style.width = size + 'px';
            spark.style.height = size + 'px';
            spark.style.left = e.clientX + 'px';
            spark.style.top = e.clientY + 'px';
            spark.style.backgroundColor = color;
            spark.style.boxShadow = '0 0 6px ' + color;
            spark.style.opacity = '1';

            document.body.appendChild(spark);

            var driftX = (Math.random() - 0.5) * 26;
            var driftY = Math.random() * 28 + 10;

            requestAnimationFrame(function() {
                spark.style.transform = 'translate(' + driftX + 'px, ' + driftY + 'px) scale(0.2)';
                spark.style.opacity = '0';
            });

            setTimeout(function() {
                spark.remove();
            }, 620);
        });
    })();
    </script>
</body>
</html>
